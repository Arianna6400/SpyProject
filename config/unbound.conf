# Local DNS resolver (L2 layer). All DNS queries from the device under
# analysis are redirected here via the iptables rules in
# config/iptables_rules.sh, regardless of the resolver configured on the
# device itself.

server:
    interface: 127.0.0.1@5353
    access-control: 0.0.0.0/0 allow
    log-queries: yes
    log-replies: yes
    logfile: "/var/log/unbound/unbound_query.log"
    verbosity: 2
    do-daemonize: no

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
