# hostapd configuration for the dedicated WiFi access point on the
# capture node (Raspberry Pi 4).
# Replace wpa_passphrase with a credential dedicated to the isolated test
# environment: do not reuse production network credentials.

interface=wlan0
driver=nl80211
ssid=SpyGuard-Testbed
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=CHANGE_ME_TESTBED_ONLY
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
